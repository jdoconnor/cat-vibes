<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kratos' Cat Playground</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #0a0a1a;
      cursor: none;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    canvas {
      display: block;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: #fff;
      pointer-events: none;
    }

    #ui h1 {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    #ui p {
      font-size: 0.85rem;
      opacity: 0.5;
      margin-top: 5px;
    }

    #score {
      position: fixed;
      top: 20px;
      right: 20px;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      z-index: 10;
      pointer-events: none;
    }

    #score span {
      color: #ff6b9d;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Kratos' Playground</h1>
    <p>click to spawn treats • move to chase • space for zoomies</p>
  </div>
  <div id="score">purr: <span id="purrCount">0</span></div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const purrEl = document.getElementById('purrCount');

    let W, H;
    let purrCount = 0;
    let zoomies = false;
    let zoomiesTimer = 0;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const mouse = { x: W / 2, y: H / 2 };
    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('click', e => {
      for (let i = 0; i < 5; i++) {
        treats.push(new Treat(e.clientX, e.clientY));
      }
    });

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' && !zoomies) {
        zoomies = true;
        zoomiesTimer = 180;
        cat.speed = 25;
        for (let i = 0; i < 30; i++) {
          particles.push(new Particle(cat.x, cat.y, `hsl(${Math.random() * 360}, 100%, 70%)`));
        }
      }
    });

    class Cat {
      constructor() {
        this.x = W / 2;
        this.y = H / 2;
        this.vx = 0;
        this.vy = 0;
        this.speed = 8;
        this.angle = 0;
        this.tailPhase = 0;
        this.eyeGlow = 0;
        this.size = 25;
      }

      update() {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 5) {
          const targetSpeed = zoomies ? 25 : (dist < 100 ? 3 : 8);
          this.vx += (dx / dist * targetSpeed - this.vx) * 0.08;
          this.vy += (dy / dist * targetSpeed - this.vy) * 0.08;
        }

        this.x += this.vx;
        this.y += this.vy;
        this.angle = Math.atan2(this.vy, this.vx);
        this.tailPhase += 0.15;
        this.eyeGlow = Math.sin(Date.now() * 0.003) * 0.3 + 0.7;

        if (Math.abs(this.vx) > 1 || Math.abs(this.vy) > 1) {
          if (Math.random() < 0.3) {
            particles.push(new Particle(this.x, this.y, '#6366f1'));
          }
        }

        if (zoomies) {
          zoomiesTimer--;
          if (Math.random() < 0.5) {
            particles.push(new Particle(this.x, this.y, `hsl(${Math.random() * 360}, 100%, 60%)`));
          }
          if (zoomiesTimer <= 0) {
            zoomies = false;
            this.speed = 8;
          }
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        const flip = this.vx < 0 ? -1 : 1;
        ctx.scale(flip, 1);

        ctx.shadowBlur = 20;
        ctx.shadowColor = '#6366f1';

        const tailWag = Math.sin(this.tailPhase) * 15;

        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-this.size * 0.8, 0);
        ctx.quadraticCurveTo(-this.size * 1.5, -20 + tailWag, -this.size * 1.2, -35 + tailWag);
        ctx.stroke();

        ctx.fillStyle = '#1e1b4b';
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#312e81';
        ctx.beginPath();
        ctx.ellipse(0, this.size * 0.2, this.size * 0.7, this.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();

        const headX = this.size * 0.7;
        const headY = -this.size * 0.3;

        ctx.fillStyle = '#1e1b4b';
        ctx.beginPath();
        ctx.arc(headX, headY, this.size * 0.55, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#312e81';
        ctx.beginPath();
        ctx.moveTo(headX - 8, headY - this.size * 0.45);
        ctx.lineTo(headX - 15, headY - this.size * 0.85);
        ctx.lineTo(headX, headY - this.size * 0.5);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(headX + 8, headY - this.size * 0.45);
        ctx.lineTo(headX + 15, headY - this.size * 0.85);
        ctx.lineTo(headX + 3, headY - this.size * 0.5);
        ctx.fill();

        ctx.shadowColor = '#a78bfa';
        ctx.shadowBlur = 15 * this.eyeGlow;
        ctx.fillStyle = `rgba(167, 139, 250, ${this.eyeGlow})`;
        ctx.beginPath();
        ctx.ellipse(headX + 5, headY - 3, 4, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(headX - 8, headY - 3, 4, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(headX + 5, headY - 3, 1.5, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(headX - 8, headY - 3, 1.5, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 1;
        for (let i = -1; i <= 1; i += 2) {
          ctx.beginPath();
          ctx.moveTo(headX + i * 12, headY + 5);
          ctx.lineTo(headX + i * 28, headY + 2 + i * 3);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(headX + i * 12, headY + 8);
          ctx.lineTo(headX + i * 25, headY + 10);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    class Treat {
      constructor(x, y) {
        this.x = x + (Math.random() - 0.5) * 40;
        this.y = y + (Math.random() - 0.5) * 40;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = (Math.random() - 0.5) * 4;
        this.life = 1;
        this.size = 8 + Math.random() * 6;
        this.hue = Math.random() * 60 + 300;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.98;
        this.vy *= 0.98;
        this.rotation += this.rotSpeed;
        this.life -= 0.003;

        const dx = cat.x - this.x;
        const dy = cat.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < cat.size + this.size) {
          this.life = 0;
          purrCount++;
          purrEl.textContent = purrCount;
          for (let i = 0; i < 8; i++) {
            particles.push(new Particle(this.x, this.y, `hsl(${this.hue}, 100%, 70%)`));
          }
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.life;

        ctx.shadowBlur = 15;
        ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;

        ctx.fillStyle = `hsl(${this.hue}, 90%, 65%)`;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
          const r = this.size;
          const x = Math.cos(angle) * r;
          const y = Math.sin(angle) * r;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.life = 1;
        this.color = color;
        this.size = 2 + Math.random() * 4;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.96;
        this.vy *= 0.96;
        this.life -= 0.02;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class Star {
      constructor() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.size = Math.random() * 2;
        this.twinkle = Math.random() * Math.PI * 2;
        this.speed = 0.02 + Math.random() * 0.03;
      }

      update() {
        this.twinkle += this.speed;
      }

      draw() {
        const alpha = Math.sin(this.twinkle) * 0.3 + 0.5;
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const cat = new Cat();
    const treats = [];
    const particles = [];
    const stars = Array.from({ length: 100 }, () => new Star());

    for (let i = 0; i < 10; i++) {
      treats.push(new Treat(Math.random() * W, Math.random() * H));
    }

    function animate() {
      ctx.fillStyle = 'rgba(10, 10, 26, 0.15)';
      ctx.fillRect(0, 0, W, H);

      stars.forEach(s => { s.update(); s.draw(); });

      for (let i = treats.length - 1; i >= 0; i--) {
        treats[i].update();
        treats[i].draw();
        if (treats[i].life <= 0) treats.splice(i, 1);
      }

      if (treats.length < 5) {
        treats.push(new Treat(Math.random() * W, Math.random() * H));
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      cat.update();
      cat.draw();

      ctx.shadowBlur = 0;

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
